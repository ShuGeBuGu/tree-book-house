<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>门后没有房间 · 树屋</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fff8ef">
  <link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32" type="image/png">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      color: #57433b;
      background:
        radial-gradient(60% 55% at 10% 5%, #ffe4e6, transparent 62%),
        radial-gradient(55% 50% at 95% 12%, #dceef9, transparent 60%),
        linear-gradient(170deg, #fffaf3, #fdf2e7);
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    .bg {
      position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
    }
    .candy {
      position: absolute; right: -220px; top: -300px;
      width: 700px; aspect-ratio: 1; border-radius: 50%;
      background: conic-gradient(from 20deg, #ffd6dd, #ffeac2, #e3efc9, #cfeaf9, #eadcf3, #ffd6dd);
      -webkit-mask: radial-gradient(circle, transparent 0 34%, #000 34.5% 72%, transparent 73%);
      mask: radial-gradient(circle, transparent 0 34%, #000 34.5% 72%, transparent 73%);
      opacity: .34; filter: blur(1px);
    }
    .hill {
      position: absolute; left: -15%; right: -15%; bottom: -30vh; height: 48vh;
      border-radius: 50% 50% 0 0; background: #dfeacb; opacity: .7;
    }
    .card {
      position: relative;
      width: min(480px, 100%);
      padding: clamp(28px, 6vw, 46px) clamp(24px, 6vw, 44px);
      border-radius: 30px;
      background: rgba(255, 253, 249, .82);
      border: 1px solid rgba(255, 255, 255, .9);
      box-shadow: 0 30px 80px rgba(108, 74, 54, .13);
      text-align: center;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }
    .logo { width: 132px; margin: 0 auto 12px; }
    .logo img { width: 100%; height: auto; display: block; }
    .error-code {
      font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
      font-size: 11px; letter-spacing: .28em; color: #d992a4; font-weight: 600;
    }
    h1 {
      margin: 10px 0 12px;
      font-family: "Arial Rounded MT Bold", "Trebuchet MS", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: clamp(30px, 7vw, 40px);
      line-height: 1.25;
      letter-spacing: -.03em;
    }
    h1 em { font-style: normal; color: #d992a4; }
    p { margin: 0 auto; max-width: 330px; color: #8d7468; font-size: 12.5px; line-height: 1.9; }
    .door {
      width: 74px; height: 88px; margin: 23px auto 21px; position: relative;
      border: 1.5px solid #795a4c; border-bottom: 0;
      border-radius: 37px 37px 0 0;
      background: linear-gradient(90deg, #f6e3cc 49.4%, #d8b696 50%, #f6e3cc 50.6%);
      box-shadow: 0 6px 0 rgba(121, 90, 76, .08);
    }
    .door::before {
      content: ""; position: absolute; inset: 9px;
      border: 1px dashed rgba(121, 90, 76, .28);
      border-bottom: 0; border-radius: 29px 29px 0 0;
    }
    .door::after {
      content: ""; position: absolute; right: 11px; top: 52%;
      width: 5px; height: 5px; border-radius: 50%; background: #8d654f;
    }
    .button {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 22px; border-radius: 999px;
      color: #fffdf9; background: #57433b;
      font-size: 12px; text-decoration: none;
      box-shadow: 0 8px 20px rgba(87, 67, 59, .18);
      transition: transform .25s ease, background .2s ease;
    }
    .button:hover { transform: translateY(-2px); background: #6b5147; }
    .foot { margin-top: 20px; color: #b29b8e; font-size: 8.5px; letter-spacing: .16em; }
    @media (max-width: 420px) {
      .card { padding-top: 26px; border-radius: 24px; }
      .logo { width: 108px; }
      .door { width: 64px; height: 76px; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="candy"></div><div class="hill"></div></div>
  <main class="card">
    <div class="logo"><img src="assets/brand/logo.webp" alt="Tree Book House"></div>
    <div class="error-code">404 · A MISSING ROOM</div>
    <h1>这扇门后面，<br>好像<em>没有房间</em>。</h1>
    <p>也许是链接写错了，也许是照片搬去了别的地方。<br>回到树屋，从大厅重新逛起吧。</p>
    <div class="door" aria-hidden="true"></div>
    <a class="button" href="./">回到树屋 <span aria-hidden="true">→</span></a>
    <div class="foot">TREE BOOK HOUSE · TAKE A LITTLE LIGHT WITH YOU</div>
  </main>
</body>
</html>
